.d{font-size:18px;font-weight:600}
.f{opacity:0;animation:frame 0.72s step-end infinite}
.f0{animation-delay:0.00s}
.f1{animation-delay:0.18s}
.f2{animation-delay:0.36s}
.f3{animation-delay:0.54s}
@keyframes frame{0%{opacity:1}25%{opacity:0}}
.flash{animation:flash 1.44s step-end infinite}
@keyframes flash{0%{fill:#ff7eb6}25%{fill:#79c0ff}50%{fill:#ffd866}75%{fill:#7ee787}}
.n{font-size:20px;opacity:0;animation:note 2.8s ease-out infinite}
@keyframes note{0%{opacity:0;transform:translate(0,0)}15%{opacity:.9}100%{opacity:0;transform:translate(10px,-46px)}}
.cur{animation:blink 1s step-end infinite}@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.f0{opacity:1}.n{opacity:.6}}
</style>
